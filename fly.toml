# Fly.io config for the room server. The machine stops itself when nobody is playing and wakes on the next connection,
# so you only pay for the minutes it runs. First time: fly launch --no-deploy (accept this file), then fly deploy.
app = "knightsofold"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  MAX_ROOMS = "6"
  # The fast lane (server/fast.ts): WebRTC over UDP on this port, dialled on the app's dedicated IPv4 (fly ips list; $2 a month, owner
  # 2026-10-07). UDP works only on a dedicated IPv4, not the shared one or IPv6. Change both if the address ever changes.
  RTC_PORT = "7777"
  RTC_PUBLIC_IP = "169.155.52.222"
  # The server's own log, on the volume below (fly logs keeps only the last 100 lines). Read it with:
  # fly ssh console --app knightsofold -C "tail -n 3000 /data/server.log"
  LOG_FILE = "/data/server.log"

# A 1 GB disk that outlasts restarts (owner, 2026-10-07; about 15 cents a month): the log above.
[mounts]
  source = "logs"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # The host checks the server is alive at /health (it answers "ok" and how many rooms are open).
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

# A whole CPU core of its own (owner, 2026-10-07): a shared one is held to 6.25% of a core once its saved-up time runs out, and the
# server then stops for the rest of every 80 ms (everyone stutters). About 4 cents an hour, only while the machine runs (it stops when idle).
# The fast lane's UDP (the server binds it on fly-global-services, as Fly.io needs for replies to go out right).
[[services]]
  internal_port = 7777
  protocol = "udp"
  [[services.ports]]
    port = 7777

[[vm]]
  size = "performance-1x"
  memory = "2gb"
