# Fly.io config for the room server. The machine stops itself when nobody is playing and wakes on the next connection,
# so you only pay for the minutes it runs. First time: fly launch --no-deploy (accept this file), then fly deploy.
app = "knightsofold"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  MAX_ROOMS = "6"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # The host checks the server is alive at /health (it answers "ok" and how many rooms are open).
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

# A whole CPU core of its own (owner, 2026-10-07): a shared one is held to 6.25% of a core once its saved-up time runs out, and the
# server then stops for the rest of every 80 ms (everyone stutters). About 4 cents an hour, only while the machine runs (it stops when idle).
[[vm]]
  size = "performance-1x"
  memory = "2gb"
